<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 104" width="512" height="208">
  <defs>
    <!-- PCB Deep Blue Soldermask Gradient -->
    <linearGradient id="relay-pcb" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#02659e"/>
      <stop offset="45%" stop-color="#025384"/>
      <stop offset="100%" stop-color="#013b5f"/>
    </linearGradient>

    <!-- Songle Relay Cube Matte Blue Gradient -->
    <linearGradient id="relay-cube" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1d66d5"/>
      <stop offset="50%" stop-color="#1856b7"/>
      <stop offset="100%" stop-color="#13479b"/>
    </linearGradient>

    <!-- Screw Terminal Block Plastic Gradient -->
    <linearGradient id="terminal-blue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e40af"/>
      <stop offset="25%" stop-color="#2563eb"/>
      <stop offset="85%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>

    <!-- Realistic Brass Screw Gradient -->
    <radialGradient id="brass-screw" cx="35%" cy="32%" r="68%">
      <stop offset="0%" stop-color="#fef9c3"/>
      <stop offset="25%" stop-color="#facc15"/>
      <stop offset="60%" stop-color="#a16207"/>
      <stop offset="90%" stop-color="#713f12"/>
      <stop offset="100%" stop-color="#451a03"/>
    </radialGradient>

    <!-- Horizontal 3D Cylindrical Metallic Leg Gradient -->
    <linearGradient id="metal-leg-horiz" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="20%" stop-color="#cbd5e1"/>
      <stop offset="45%" stop-color="#ffffff"/>
      <stop offset="75%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>

    <!-- LED Red 3D Bulb Gradient -->
    <radialGradient id="led-red" cx="32%" cy="30%" r="68%">
      <stop offset="0%" stop-color="#fecaca"/>
      <stop offset="25%" stop-color="#f87171"/>
      <stop offset="60%" stop-color="#dc2626"/>
      <stop offset="90%" stop-color="#991b1b"/>
      <stop offset="100%" stop-color="#450a0a"/>
    </radialGradient>

    <!-- LED Green 3D Bulb Gradient -->
    <radialGradient id="led-green" cx="32%" cy="30%" r="68%">
      <stop offset="0%" stop-color="#dcfce7"/>
      <stop offset="25%" stop-color="#4ade80"/>
      <stop offset="60%" stop-color="#16a34a"/>
      <stop offset="90%" stop-color="#15803d"/>
      <stop offset="100%" stop-color="#052e16"/>
    </radialGradient>

    <!-- Copper Annular Ring Gradient -->
    <radialGradient id="copper-pad" cx="45%" cy="45%" r="55%">
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="85%" stop-color="#a16207"/>
      <stop offset="100%" stop-color="#713f12"/>
    </radialGradient>
  </defs>

  <!-- 1. PCB Base Plate (x=0 to 237, y=0 to 104) -->
  <rect x="0.5" y="0.5" width="236" height="103" rx="4" fill="url(#relay-pcb)" stroke="#0284c7" stroke-width="1"/>
  <rect x="2" y="2" width="233" height="100" rx="3" fill="none" stroke="#38bdf8" stroke-width="0.5" opacity="0.3"/>

  <!-- 4 Corner Mounting Holes -->
  <circle cx="7.5" cy="7.5" r="4.5" fill="url(#copper-pad)" stroke="#713f12" stroke-width="0.6"/>
  <circle cx="7.5" cy="7.5" r="2.2" fill="#020617"/>
  <circle cx="7.5" cy="96.5" r="4.5" fill="url(#copper-pad)" stroke="#713f12" stroke-width="0.6"/>
  <circle cx="7.5" cy="96.5" r="2.2" fill="#020617"/>
  <circle cx="229.5" cy="7.5" r="4.5" fill="url(#copper-pad)" stroke="#713f12" stroke-width="0.6"/>
  <circle cx="229.5" cy="7.5" r="2.2" fill="#020617"/>
  <circle cx="229.5" cy="96.5" r="4.5" fill="url(#copper-pad)" stroke="#713f12" stroke-width="0.6"/>
  <circle cx="229.5" cy="96.5" r="2.2" fill="#020617"/>

  <!-- 2. Leftmost Silkscreen (Terminal Legends) -->
  <g fill="#ffffff" opacity="0.85" font-family="'JetBrains Mono', 'Segoe UI', system-ui, sans-serif">
    <text x="3" y="19" font-size="6.5" font-weight="bold">NO</text>
    <text x="3.5" y="27" font-size="5.2" opacity="0.75" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif">常开</text>

    <text x="2" y="50" font-size="6.5" font-weight="bold">COM</text>
    <text x="3.5" y="58" font-size="5.2" opacity="0.75" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif">公共</text>

    <text x="3" y="80" font-size="6.5" font-weight="bold">NC</text>
    <text x="3.5" y="88" font-size="5.2" opacity="0.75" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif">常闭</text>
  </g>

  <!-- 3. Blue 3-Port Screw Terminal Block (Left Side) -->
  <g>
    <rect x="18" y="6" width="50" height="92" rx="3" fill="url(#terminal-blue)" stroke="#172554" stroke-width="1.2"/>
    <polygon points="18,6 22,9 64,9 68,6" fill="#3b82f6" opacity="0.5"/>
    <polygon points="68,6 64,9 64,95 68,98" fill="#172554" opacity="0.7"/>

    <rect x="18" y="34.5" width="46" height="4" fill="#090d16" opacity="0.6"/>
    <line x1="18" y1="36.5" x2="64" y2="36.5" stroke="#172554" stroke-width="1.2"/>
    <rect x="18" y="65.5" width="46" height="4" fill="#090d16" opacity="0.6"/>
    <line x1="18" y1="67.5" x2="64" y2="67.5" stroke="#172554" stroke-width="1.2"/>

    <!-- Screw 1 (NO) at cx=43.0, cy=21.5 -->
    <g transform="translate(43.0, 21.5)">
      <circle cx="0" cy="0" r="12" fill="#090d16" stroke="#1e3a8a" stroke-width="1"/>
      <circle cx="0" cy="0" r="10" fill="#172554"/>
      <circle cx="0" cy="0" r="9" fill="url(#brass-screw)" stroke="#713f12" stroke-width="0.8"/>
      <path d="M -5.5 -5.5 A 7.5 7.5 0 0 1 5.5 -5.5" fill="none" stroke="#fef08a" stroke-width="1.2" opacity="0.75"/>
      <rect x="-1.5" y="-6" width="3" height="12" fill="#291804"/>
      <rect x="-6" y="-1.5" width="12" height="3" fill="#291804"/>
      <line x1="-1.5" y1="-5.5" x2="-1.5" y2="5.5" stroke="#fef08a" stroke-width="0.6" opacity="0.5"/>
      <line x1="-5.5" y1="-1.5" x2="5.5" y2="-1.5" stroke="#fef08a" stroke-width="0.6" opacity="0.5"/>
    </g>

    <!-- Screw 2 (COM) at cx=43.0, cy=52.0 -->
    <g transform="translate(43.0, 52.0)">
      <circle cx="0" cy="0" r="12" fill="#090d16" stroke="#1e3a8a" stroke-width="1"/>
      <circle cx="0" cy="0" r="10" fill="#172554"/>
      <circle cx="0" cy="0" r="9" fill="url(#brass-screw)" stroke="#713f12" stroke-width="0.8"/>
      <path d="M -5.5 -5.5 A 7.5 7.5 0 0 1 5.5 -5.5" fill="none" stroke="#fef08a" stroke-width="1.2" opacity="0.75"/>
      <rect x="-1.5" y="-6" width="3" height="12" fill="#291804"/>
      <rect x="-6" y="-1.5" width="12" height="3" fill="#291804"/>
      <line x1="-1.5" y1="-5.5" x2="-1.5" y2="5.5" stroke="#fef08a" stroke-width="0.6" opacity="0.5"/>
      <line x1="-5.5" y1="-1.5" x2="5.5" y2="-1.5" stroke="#fef08a" stroke-width="0.6" opacity="0.5"/>
    </g>

    <!-- Screw 3 (NC) at cx=43.0, cy=82.5 -->
    <g transform="translate(43.0, 82.5)">
      <circle cx="0" cy="0" r="12" fill="#090d16" stroke="#1e3a8a" stroke-width="1"/>
      <circle cx="0" cy="0" r="10" fill="#172554"/>
      <circle cx="0" cy="0" r="9" fill="url(#brass-screw)" stroke="#713f12" stroke-width="0.8"/>
      <path d="M -5.5 -5.5 A 7.5 7.5 0 0 1 5.5 -5.5" fill="none" stroke="#fef08a" stroke-width="1.2" opacity="0.75"/>
      <rect x="-1.5" y="-6" width="3" height="12" fill="#291804"/>
      <rect x="-6" y="-1.5" width="12" height="3" fill="#291804"/>
      <line x1="-1.5" y1="-5.5" x2="-1.5" y2="5.5" stroke="#fef08a" stroke-width="0.6" opacity="0.5"/>
      <line x1="-5.5" y1="-1.5" x2="5.5" y2="-1.5" stroke="#fef08a" stroke-width="0.6" opacity="0.5"/>
    </g>
  </g>

  <!-- 4. Songle JQC-3F-05VDC-C Blue Cube Relay (Center) -->
  <g>
    <rect x="74" y="10" width="96" height="88" rx="2.5" fill="#020617" opacity="0.38"/>
    <rect x="72" y="8" width="95" height="88" rx="2" fill="url(#relay-cube)" stroke="#1d4ed8" stroke-width="1"/>
    <line x1="73" y1="9" x2="166" y2="9" stroke="#60a5fa" stroke-width="0.8" opacity="0.65"/>
    <line x1="73" y1="9" x2="73" y2="95" stroke="#60a5fa" stroke-width="0.8" opacity="0.65"/>

    <circle cx="157" cy="18" r="5" fill="#0e378c" stroke="#082562" stroke-width="0.6"/>
    <circle cx="130" cy="48" r="3.5" fill="#0e378c" stroke="#082562" stroke-width="0.6"/>

    <g fill="#ffffff" opacity="0.95" font-family="'JetBrains Mono', 'Segoe UI', system-ui, sans-serif">
      <g transform="translate(77, 28)">
        <rect x="0" y="-8" width="18" height="10" rx="4" fill="none" stroke="#ffffff" stroke-width="0.8"/>
        <text x="9" y="-1" font-size="6.5" font-weight="bold" text-anchor="middle">CQC</text>

        <path d="M 23 2 L 30 -8 L 37 2 Z" fill="none" stroke="#ffffff" stroke-width="0.8"/>
        <text x="30" y="0" font-size="6" font-weight="bold" text-anchor="middle">Δ</text>

        <text x="44" y="-1" font-size="7.5" font-weight="bold">c</text>
        <text x="49" y="-1" font-size="7.5" font-weight="bold">ЯU</text>
        <text x="59" y="-3" font-size="5" font-weight="bold">US</text>
      </g>

      <text x="77" y="44" font-size="6.8" font-weight="600" letter-spacing="0.2">10A 250VAC  10A 30VDC</text>
      <text x="77" y="55" font-size="6.8" font-weight="600" letter-spacing="0.2">10A 125VAC  10A 28VDC</text>
      <text x="77" y="73" font-size="9" font-weight="800" letter-spacing="0.4">JQC-3F-05VDC-C</text>
    </g>
  </g>

  <!-- 5. Right Side Control Section (SMD, LEDs, & Header Pins with Clean Metallic Legs) -->
  <g>
    <!-- Silkscreen Box around SMD Section -->
    <rect x="172" y="10" width="31" height="84" rx="2" fill="none" stroke="#ffffff" stroke-width="0.6" opacity="0.3"/>

    <!-- 3 SMD Resistors -->
    <g transform="translate(179, 18)">
      <rect x="0" y="0" width="16" height="8" rx="1" fill="#0f172a" stroke="#334155" stroke-width="0.5"/>
      <rect x="0" y="0" width="3" height="8" fill="#94a3b8"/>
      <rect x="13" y="0" width="3" height="8" fill="#94a3b8"/>
      <text x="8" y="6" font-size="4.8" font-weight="bold" fill="#f8fafc" text-anchor="middle" font-family="monospace">201</text>
    </g>
    <g transform="translate(179, 30)">
      <rect x="0" y="0" width="16" height="8" rx="1" fill="#0f172a" stroke="#334155" stroke-width="0.5"/>
      <rect x="0" y="0" width="3" height="8" fill="#94a3b8"/>
      <rect x="13" y="0" width="3" height="8" fill="#94a3b8"/>
      <text x="8" y="6" font-size="4.8" font-weight="bold" fill="#f8fafc" text-anchor="middle" font-family="monospace">102</text>
    </g>
    <g transform="translate(179, 42)">
      <rect x="0" y="0" width="16" height="8" rx="1" fill="#0f172a" stroke="#334155" stroke-width="0.5"/>
      <rect x="0" y="0" width="3" height="8" fill="#94a3b8"/>
      <rect x="13" y="0" width="3" height="8" fill="#94a3b8"/>
      <text x="8" y="6" font-size="4.8" font-weight="bold" fill="#f8fafc" text-anchor="middle" font-family="monospace">102</text>
    </g>

    <!-- Transistor SOT-23 -->
    <g transform="translate(181, 58)">
      <rect x="0" y="0" width="12" height="9" rx="1" fill="#090d16" stroke="#1e293b" stroke-width="0.5"/>
      <rect x="-2" y="1.5" width="2" height="2" fill="#94a3b8"/>
      <rect x="-2" y="5.5" width="2" height="2" fill="#94a3b8"/>
      <rect x="12" y="3.5" width="2" height="2" fill="#94a3b8"/>
    </g>

    <!-- Flyback Diode -->
    <g transform="translate(175, 76)">
      <rect x="0" y="0" width="22" height="6.5" rx="2" fill="#c2410c" stroke="#7c2d12" stroke-width="0.5"/>
      <rect x="0" y="0" width="4" height="6.5" fill="#1e293b"/>
      <line x1="-3" y1="3.2" x2="0" y2="3.2" stroke="#94a3b8" stroke-width="1"/>
      <line x1="22" y1="3.2" x2="25" y2="3.2" stroke="#94a3b8" stroke-width="1"/>
      <rect x="3" y="1" width="17" height="1.5" fill="#ffedd5" opacity="0.6"/>
    </g>

    <!-- Silkscreen Text Labels on PCB (Between SMD and Header) -->
    <g fill="#ffffff" opacity="0.8" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" font-size="5.5">
      <text x="207" y="24" text-anchor="middle">电源</text>
      <text x="207" y="86" text-anchor="middle">开关</text>
    </g>

    <!-- Pin Name Labels (IN, GND, VCC) on PCB Surface -->
    <g fill="#ffffff" opacity="0.95" font-family="'JetBrains Mono', 'Segoe UI', system-ui, sans-serif" font-size="7" font-weight="bold">
      <text x="208" y="37.5" text-anchor="middle">IN</text>
      <text x="208" y="54.5" text-anchor="middle">GND</text>
      <text x="208" y="71.5" text-anchor="middle">VCC</text>
    </g>

    <!-- LED 1: Red Power Indicator (Top Right) at cx=222, cy=16 -->
    <g transform="translate(222, 16)">
      <circle cx="0" cy="0" r="7.5" fill="#1e293b" stroke="#334155" stroke-width="0.8"/>
      <circle cx="0" cy="0" r="6" fill="url(#led-red)" stroke="#991b1b" stroke-width="0.8"/>
      <ellipse cx="-1.8" cy="-1.8" rx="2" ry="1.2" fill="#ffffff" opacity="0.8" transform="rotate(-30, -1.8, -1.8)"/>
    </g>

    <!-- LED 2: Green Relay State Indicator (Bottom Right) at cx=222, cy=88 -->
    <g transform="translate(222, 88)">
      <circle cx="0" cy="0" r="7.5" fill="#1e293b" stroke="#334155" stroke-width="0.8"/>
      <circle cx="0" cy="0" r="6" fill="url(#led-green)" stroke="#166534" stroke-width="0.8"/>
      <ellipse cx="-1.8" cy="-1.8" rx="2" ry="1.2" fill="#ffffff" opacity="0.8" transform="rotate(-30, -1.8, -1.8)"/>
    </g>

    <!-- Unified Breakaway Header Strip (3 Interconnected Segments with Individual Rounded Corners & V-Grooves) -->
    <g id="header-housing-body">
      <!-- Outer Silkscreen Enclosure Border -->
      <rect x="215" y="24.5" width="16" height="55" rx="2" fill="none" stroke="#ffffff" stroke-width="1.2" opacity="0.9"/>
      <rect x="216" y="27" width="14" height="50" fill="#000000"/>
      <!-- 3 Individual Cubes with Rounded Corners -->
      <rect x="215.5" y="27" width="15" height="16" rx="3" fill="#09090b" stroke="#27272a" stroke-width="0.6"/>
      <rect x="215.5" y="44" width="15" height="16" rx="3" fill="#09090b" stroke="#27272a" stroke-width="0.6"/>
      <rect x="215.5" y="61" width="15" height="16" rx="3" fill="#09090b" stroke="#27272a" stroke-width="0.6"/>
      <!-- Chamfer Facet Highlights -->
      <path d="M 230.5 29.5 L 230.5 40.5 L 228 39.5 L 228 30.5 Z" fill="#52525b" opacity="0.8"/>
      <path d="M 230.5 46.5 L 230.5 57.5 L 228 56.5 L 228 47.5 Z" fill="#52525b" opacity="0.8"/>
      <path d="M 230.5 63.5 L 230.5 74.5 L 228 73.5 L 228 64.5 Z" fill="#52525b" opacity="0.8"/>
      <!-- V-Groove Breakaway Notches -->
      <line x1="215.5" y1="43.5" x2="230.5" y2="43.5" stroke="#000000" stroke-width="1.2"/>
      <line x1="215.5" y1="60.5" x2="230.5" y2="60.5" stroke="#000000" stroke-width="1.2"/>
    </g>

    <!-- Clean Cylindrical 3D Metallic Pins (No Bulatan / Rings, Sleek & Compact) -->
    <!-- Pin 1: IN at y=35.0, extends from x=222 to x=252 (extends 15px past PCB) -->
    <g transform="translate(0, 35.0)">
      <rect x="222" y="-1.6" width="30" height="3.2" rx="0.8" fill="url(#metal-leg-horiz)" stroke="#475569" stroke-width="0.5"/>
      <ellipse cx="252" cy="0" rx="1.0" ry="1.6" fill="#cbd5e1" stroke="#475569" stroke-width="0.5"/>
    </g>

    <!-- Pin 2: GND at y=52.0, extends from x=222 to x=252 -->
    <g transform="translate(0, 52.0)">
      <rect x="222" y="-1.6" width="30" height="3.2" rx="0.8" fill="url(#metal-leg-horiz)" stroke="#475569" stroke-width="0.5"/>
      <ellipse cx="252" cy="0" rx="1.0" ry="1.6" fill="#cbd5e1" stroke="#475569" stroke-width="0.5"/>
    </g>

    <!-- Pin 3: VCC at y=69.0, extends from x=222 to x=252 -->
    <g transform="translate(0, 69.0)">
      <rect x="222" y="-1.6" width="30" height="3.2" rx="0.8" fill="url(#metal-leg-horiz)" stroke="#475569" stroke-width="0.5"/>
      <ellipse cx="252" cy="0" rx="1.0" ry="1.6" fill="#cbd5e1" stroke="#475569" stroke-width="0.5"/>
    </g>
  </g>
</svg>