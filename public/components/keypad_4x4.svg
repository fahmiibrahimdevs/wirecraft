<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 400" width="560" height="800">
  <defs>
    <!-- Socket circle gradient on connector housing -->
    <radialGradient id="kp4-socket-grad" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#9ca3af"/>
      <stop offset="60%" stop-color="#6b7280"/>
      <stop offset="100%" stop-color="#374151"/>
    </radialGradient>

    <!-- Pin tip metallic gradient -->
    <linearGradient id="kp4-pin-tip" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d4af37"/>
      <stop offset="50%" stop-color="#b0a084"/>
      <stop offset="100%" stop-color="#85755b"/>
    </linearGradient>
  </defs>

  <!-- ============================================================ -->
  <!-- 1. FLEX RIBBON CABLE (Extending down from keypad to connector)-->
  <!-- ============================================================ -->
  <g id="ribbon-cable">
    <!-- Semi-transparent flexible ribbon plastic substrate -->
    <rect x="74" y="260" width="132" height="96" rx="2" fill="#cadee4" fill-opacity="0.55"/>

    <!-- 8 Conductive traces (Pitch 17.0px exactly) -->
    <!-- x = 80.5, 97.5, 114.5, 131.5, 148.5, 165.5, 182.5, 199.5 -->
    <!-- Left 4 rows (olive-gold in screenshot) -->
    <line x1="80.5" y1="260" x2="80.5" y2="354" stroke="#8a7e56" stroke-width="3.4" stroke-linecap="butt"/>
    <line x1="97.5" y1="260" x2="97.5" y2="354" stroke="#8a7e56" stroke-width="3.4" stroke-linecap="butt"/>
    <line x1="114.5" y1="260" x2="114.5" y2="354" stroke="#8a7e56" stroke-width="3.4" stroke-linecap="butt"/>
    <line x1="131.5" y1="260" x2="131.5" y2="354" stroke="#8a7e56" stroke-width="3.4" stroke-linecap="butt"/>

    <!-- Right 4 cols (light-tan in screenshot) -->
    <line x1="148.5" y1="260" x2="148.5" y2="354" stroke="#d5cfb5" stroke-width="3.4" stroke-linecap="butt"/>
    <line x1="165.5" y1="260" x2="165.5" y2="354" stroke="#d5cfb5" stroke-width="3.4" stroke-linecap="butt"/>
    <line x1="182.5" y1="260" x2="182.5" y2="354" stroke="#d5cfb5" stroke-width="3.4" stroke-linecap="butt"/>
    <line x1="199.5" y1="260" x2="199.5" y2="354" stroke="#d5cfb5" stroke-width="3.4" stroke-linecap="butt"/>
  </g>

  <!-- ============================================================ -->
  <!-- 2. MAIN KEYPAD BODY (4x4 Matrix Faceplate: Perfectly Centered)-->
  <!-- ============================================================ -->
  <g id="keypad-faceplate">
    <!-- Outer dark matte casing -->
    <rect x="4" y="4" width="272" height="272" rx="24" fill="#393a40"/>

    <!-- Inner double border lines (Balanced top & bottom padding) -->
    <rect x="12" y="12" width="256" height="256" rx="18" fill="none" stroke="#6b7280" stroke-width="1.3"/>
    <rect x="17" y="17" width="246" height="246" rx="14" fill="none" stroke="#ffffff" stroke-width="1.3"/>

    <!-- ============================================================ -->
    <!-- ROW 1: 1 (Blue), 2 (Blue), 3 (Blue), A (Red) at y=37 -->
    <!-- ============================================================ -->
    <!-- Button 1 -->
    <g transform="translate(34, 37)">
      <rect width="44" height="44" rx="9" fill="#4a90e1" stroke="#ffffff" stroke-width="1.3"/>
      <text x="22" y="32" fill="#ffffff" font-family="'Segoe UI', 'Droid Sans', Arial, sans-serif" font-size="28" font-weight="bold" text-anchor="middle">1</text>
    </g>
    <!-- Button 2 -->
    <g transform="translate(90, 37)">
      <rect width="44" height="44" rx="9" fill="#4a90e1" stroke="#ffffff" stroke-width="1.3"/>
      <text x="22" y="32" fill="#ffffff" font-family="'Segoe UI', 'Droid Sans', Arial, sans-serif" font-size="28" font-weight="bold" text-anchor="middle">2</text>
    </g>
    <!-- Button 3 -->
    <g transform="translate(146, 37)">
      <rect width="44" height="44" rx="9" fill="#4a90e1" stroke="#ffffff" stroke-width="1.3"/>
      <text x="22" y="32" fill="#ffffff" font-family="'Segoe UI', 'Droid Sans', Arial, sans-serif" font-size="28" font-weight="bold" text-anchor="middle">3</text>
    </g>
    <!-- Button A -->
    <g transform="translate(202, 37)">
      <rect width="44" height="44" rx="9" fill="#d9534f" stroke="#ffffff" stroke-width="1.3"/>
      <text x="22" y="32" fill="#ffffff" font-family="'Segoe UI', 'Droid Sans', Arial, sans-serif" font-size="28" font-weight="bold" text-anchor="middle">A</text>
    </g>

    <!-- ============================================================ -->
    <!-- ROW 2: 4 (Blue), 5 (Blue), 6 (Blue), B (Red) at y=91 -->
    <!-- ============================================================ -->
    <!-- Button 4 -->
    <g transform="translate(34, 91)">
      <rect width="44" height="44" rx="9" fill="#4a90e1" stroke="#ffffff" stroke-width="1.3"/>
      <text x="22" y="32" fill="#ffffff" font-family="'Segoe UI', 'Droid Sans', Arial, sans-serif" font-size="28" font-weight="bold" text-anchor="middle">4</text>
    </g>
    <!-- Button 5 -->
    <g transform="translate(90, 91)">
      <rect width="44" height="44" rx="9" fill="#4a90e1" stroke="#ffffff" stroke-width="1.3"/>
      <text x="22" y="32" fill="#ffffff" font-family="'Segoe UI', 'Droid Sans', Arial, sans-serif" font-size="28" font-weight="bold" text-anchor="middle">5</text>
    </g>
    <!-- Button 6 -->
    <g transform="translate(146, 91)">
      <rect width="44" height="44" rx="9" fill="#4a90e1" stroke="#ffffff" stroke-width="1.3"/>
      <text x="22" y="32" fill="#ffffff" font-family="'Segoe UI', 'Droid Sans', Arial, sans-serif" font-size="28" font-weight="bold" text-anchor="middle">6</text>
    </g>
    <!-- Button B -->
    <g transform="translate(202, 91)">
      <rect width="44" height="44" rx="9" fill="#d9534f" stroke="#ffffff" stroke-width="1.3"/>
      <text x="22" y="32" fill="#ffffff" font-family="'Segoe UI', 'Droid Sans', Arial, sans-serif" font-size="28" font-weight="bold" text-anchor="middle">B</text>
    </g>

    <!-- ============================================================ -->
    <!-- ROW 3: 7 (Blue), 8 (Blue), 9 (Blue), C (Red) at y=145 -->
    <!-- ============================================================ -->
    <!-- Button 7 -->
    <g transform="translate(34, 145)">
      <rect width="44" height="44" rx="9" fill="#4a90e1" stroke="#ffffff" stroke-width="1.3"/>
      <text x="22" y="32" fill="#ffffff" font-family="'Segoe UI', 'Droid Sans', Arial, sans-serif" font-size="28" font-weight="bold" text-anchor="middle">7</text>
    </g>
    <!-- Button 8 -->
    <g transform="translate(90, 145)">
      <rect width="44" height="44" rx="9" fill="#4a90e1" stroke="#ffffff" stroke-width="1.3"/>
      <text x="22" y="32" fill="#ffffff" font-family="'Segoe UI', 'Droid Sans', Arial, sans-serif" font-size="28" font-weight="bold" text-anchor="middle">8</text>
    </g>
    <!-- Button 9 -->
    <g transform="translate(146, 145)">
      <rect width="44" height="44" rx="9" fill="#4a90e1" stroke="#ffffff" stroke-width="1.3"/>
      <text x="22" y="32" fill="#ffffff" font-family="'Segoe UI', 'Droid Sans', Arial, sans-serif" font-size="28" font-weight="bold" text-anchor="middle">9</text>
    </g>
    <!-- Button C -->
    <g transform="translate(202, 145)">
      <rect width="44" height="44" rx="9" fill="#d9534f" stroke="#ffffff" stroke-width="1.3"/>
      <text x="22" y="32" fill="#ffffff" font-family="'Segoe UI', 'Droid Sans', Arial, sans-serif" font-size="28" font-weight="bold" text-anchor="middle">C</text>
    </g>

    <!-- ============================================================ -->
    <!-- ROW 4: * (Red), 0 (Blue), # (Red), D (Red) at y=199 -->
    <!-- ============================================================ -->
    <!-- Button * (Red) -->
    <g transform="translate(34, 199)">
      <rect width="44" height="44" rx="9" fill="#d9534f" stroke="#ffffff" stroke-width="1.3"/>
      <text x="22" y="35" fill="#ffffff" font-family="'Segoe UI', 'Droid Sans', Arial, sans-serif" font-size="34" font-weight="bold" text-anchor="middle">*</text>
    </g>
    <!-- Button 0 (Blue) -->
    <g transform="translate(90, 199)">
      <rect width="44" height="44" rx="9" fill="#4a90e1" stroke="#ffffff" stroke-width="1.3"/>
      <text x="22" y="32" fill="#ffffff" font-family="'Segoe UI', 'Droid Sans', Arial, sans-serif" font-size="28" font-weight="bold" text-anchor="middle">0</text>
    </g>
    <!-- Button # (Red) -->
    <g transform="translate(146, 199)">
      <rect width="44" height="44" rx="9" fill="#d9534f" stroke="#ffffff" stroke-width="1.3"/>
      <text x="22" y="32" fill="#ffffff" font-family="'Segoe UI', 'Droid Sans', Arial, sans-serif" font-size="28" font-weight="bold" text-anchor="middle">#</text>
    </g>
    <!-- Button D (Red) -->
    <g transform="translate(202, 199)">
      <rect width="44" height="44" rx="9" fill="#d9534f" stroke="#ffffff" stroke-width="1.3"/>
      <text x="22" y="32" fill="#ffffff" font-family="'Segoe UI', 'Droid Sans', Arial, sans-serif" font-size="28" font-weight="bold" text-anchor="middle">D</text>
    </g>
  </g>

  <!-- ============================================================ -->
  <!-- 3. BOTTOM CONNECTOR (Housing + 8 Sockets & Round Tip Pins) -->
  <!-- ============================================================ -->
  <g id="bottom-connector">
    <!-- Solid dark housing box -->
    <rect x="70" y="354" width="140" height="34" rx="2" fill="#333333"/>

    <!-- 8 Socket circles on housing body -->
    <circle cx="80.5" cy="372" r="4.2" fill="url(#kp4-socket-grad)" stroke="#1e293b" stroke-width="0.8"/>
    <circle cx="97.5" cy="372" r="4.2" fill="url(#kp4-socket-grad)" stroke="#1e293b" stroke-width="0.8"/>
    <circle cx="114.5" cy="372" r="4.2" fill="url(#kp4-socket-grad)" stroke="#1e293b" stroke-width="0.8"/>
    <circle cx="131.5" cy="372" r="4.2" fill="url(#kp4-socket-grad)" stroke="#1e293b" stroke-width="0.8"/>
    <circle cx="148.5" cy="372" r="4.2" fill="url(#kp4-socket-grad)" stroke="#1e293b" stroke-width="0.8"/>
    <circle cx="165.5" cy="372" r="4.2" fill="url(#kp4-socket-grad)" stroke="#1e293b" stroke-width="0.8"/>
    <circle cx="182.5" cy="372" r="4.2" fill="url(#kp4-socket-grad)" stroke="#1e293b" stroke-width="0.8"/>
    <circle cx="199.5" cy="372" r="4.2" fill="url(#kp4-socket-grad)" stroke="#1e293b" stroke-width="0.8"/>

    <!-- 8 Short Pins with Round Tips (Opsi B) -->
    <!-- Pitch exactly 17.0px: x = 80.5, 97.5, 114.5, 131.5, 148.5, 165.5, 182.5, 199.5, y = 394.0 -->
    <!-- Pin 1: R1 at x=80.5 -->
    <g transform="translate(80.5, 0)">
      <line x1="0" y1="388" x2="0" y2="393" stroke="#ecc98a" stroke-width="2.6" stroke-linecap="butt"/>
      <circle cx="0" cy="394.0" r="2.4" fill="url(#kp4-pin-tip)" stroke="#78716c" stroke-width="0.4"/>
    </g>
    <!-- Pin 2: R2 at x=97.5 -->
    <g transform="translate(97.5, 0)">
      <line x1="0" y1="388" x2="0" y2="393" stroke="#ecc98a" stroke-width="2.6" stroke-linecap="butt"/>
      <circle cx="0" cy="394.0" r="2.4" fill="url(#kp4-pin-tip)" stroke="#78716c" stroke-width="0.4"/>
    </g>
    <!-- Pin 3: R3 at x=114.5 -->
    <g transform="translate(114.5, 0)">
      <line x1="0" y1="388" x2="0" y2="393" stroke="#ecc98a" stroke-width="2.6" stroke-linecap="butt"/>
      <circle cx="0" cy="394.0" r="2.4" fill="url(#kp4-pin-tip)" stroke="#78716c" stroke-width="0.4"/>
    </g>
    <!-- Pin 4: R4 at x=131.5 -->
    <g transform="translate(131.5, 0)">
      <line x1="0" y1="388" x2="0" y2="393" stroke="#ecc98a" stroke-width="2.6" stroke-linecap="butt"/>
      <circle cx="0" cy="394.0" r="2.4" fill="url(#kp4-pin-tip)" stroke="#78716c" stroke-width="0.4"/>
    </g>
    <!-- Pin 5: C1 at x=148.5 -->
    <g transform="translate(148.5, 0)">
      <line x1="0" y1="388" x2="0" y2="393" stroke="#ecc98a" stroke-width="2.6" stroke-linecap="butt"/>
      <circle cx="0" cy="394.0" r="2.4" fill="url(#kp4-pin-tip)" stroke="#78716c" stroke-width="0.4"/>
    </g>
    <!-- Pin 6: C2 at x=165.5 -->
    <g transform="translate(165.5, 0)">
      <line x1="0" y1="388" x2="0" y2="393" stroke="#ecc98a" stroke-width="2.6" stroke-linecap="butt"/>
      <circle cx="0" cy="394.0" r="2.4" fill="url(#kp4-pin-tip)" stroke="#78716c" stroke-width="0.4"/>
    </g>
    <!-- Pin 7: C3 at x=182.5 -->
    <g transform="translate(182.5, 0)">
      <line x1="0" y1="388" x2="0" y2="393" stroke="#ecc98a" stroke-width="2.6" stroke-linecap="butt"/>
      <circle cx="0" cy="394.0" r="2.4" fill="url(#kp4-pin-tip)" stroke="#78716c" stroke-width="0.4"/>
    </g>
    <!-- Pin 8: C4 at x=199.5 -->
    <g transform="translate(199.5, 0)">
      <line x1="0" y1="388" x2="0" y2="393" stroke="#ecc98a" stroke-width="2.6" stroke-linecap="butt"/>
      <circle cx="0" cy="394.0" r="2.4" fill="url(#kp4-pin-tip)" stroke="#78716c" stroke-width="0.4"/>
    </g>
  </g>
</svg>
