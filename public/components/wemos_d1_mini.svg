<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 228 173" width="228" height="173">
  <defs>
    <!-- PCB Blue Gradient -->
    <linearGradient id="pcbGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#075985" />
    </linearGradient>

    <!-- Metal Shield Gradient -->
    <linearGradient id="metalShield" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0" />
      <stop offset="40%" stop-color="#cbd5e1" />
      <stop offset="70%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>

    <!-- USB Connector Gradient -->
    <linearGradient id="usbMetal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f1f5f9" />
      <stop offset="30%" stop-color="#cbd5e1" />
      <stop offset="70%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>

    <!-- Gold Pin / Pad Gradient -->
    <radialGradient id="goldPad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="60%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </radialGradient>
  </defs>

  <!-- 1. PCB Base Board -->
  <rect x="16" y="0" width="196" height="173" rx="10" fill="url(#pcbGrad)" stroke="#0369a1" stroke-width="1.5" />

  <!-- PCB Corner Mounting Holes -->
  <circle cx="26" cy="18" r="3.5" fill="#075985" stroke="#ca8a04" stroke-width="1.2" />
  <circle cx="26" cy="155" r="3.5" fill="#075985" stroke="#ca8a04" stroke-width="1.2" />

  <!-- 2. Micro USB Port (Left side, protruding slightly) -->
  <rect x="0" y="66" width="34" height="41" rx="3" fill="url(#usbMetal)" stroke="#334155" stroke-width="1.2" />
  <!-- USB inner cavity -->
  <path d="M 4 72 L 20 72 L 20 101 L 4 101 Z" fill="#0f172a" />
  <!-- USB metal tabs -->
  <rect x="6" y="78" width="10" height="17" rx="1" fill="#64748b" />
  <!-- USB solder pads -->
  <rect x="30" y="69" width="5" height="6" fill="#eab308" />
  <rect x="30" y="98" width="5" height="6" fill="#eab308" />

  <!-- 3. Reset Push Button (Bottom Left) -->
  <rect x="38" y="116" width="14" height="18" rx="2" fill="#334155" stroke="#1e293b" stroke-width="0.8" />
  <circle cx="45" cy="125" r="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1" />
  <rect x="35" y="119" width="3" height="3" fill="#94a3b8" />
  <rect x="35" y="128" width="3" height="3" fill="#94a3b8" />
  <rect x="52" y="119" width="3" height="3" fill="#94a3b8" />
  <rect x="52" y="128" width="3" height="3" fill="#94a3b8" />
  <text x="45" y="143" font-family="monospace" font-size="6" font-weight="bold" fill="#ffffff" text-anchor="middle">RST</text>

  <!-- 4. USB-to-UART IC (CH340C / CP2102) -->
  <rect x="44" y="42" width="24" height="20" rx="2" fill="#0f172a" stroke="#334155" stroke-width="1" />
  <!-- IC Pin 1 indicator -->
  <circle cx="48" cy="46" r="1" fill="#64748b" />
  <!-- IC Pins Left/Right -->
  <line x1="41" y1="46" x2="44" y2="46" stroke="#cbd5e1" stroke-width="1" />
  <line x1="41" y1="50" x2="44" y2="50" stroke="#cbd5e1" stroke-width="1" />
  <line x1="41" y1="54" x2="44" y2="54" stroke="#cbd5e1" stroke-width="1" />
  <line x1="41" y1="58" x2="44" y2="58" stroke="#cbd5e1" stroke-width="1" />
  <line x1="68" y1="46" x2="71" y2="46" stroke="#cbd5e1" stroke-width="1" />
  <line x1="68" y1="50" x2="71" y2="50" stroke="#cbd5e1" stroke-width="1" />
  <line x1="68" y1="54" x2="71" y2="54" stroke="#cbd5e1" stroke-width="1" />
  <line x1="68" y1="58" x2="71" y2="58" stroke="#cbd5e1" stroke-width="1" />
  <text x="56" y="54" font-family="monospace" font-size="5" fill="#94a3b8" text-anchor="middle">CH340</text>

  <!-- 5. 3.3V LDO Voltage Regulator (RT9013) & SMD Passives -->
  <rect x="45" y="78" width="14" height="12" rx="1" fill="#0f172a" />
  <rect x="43" y="80" width="2" height="2" fill="#cbd5e1" />
  <rect x="43" y="86" width="2" height="2" fill="#cbd5e1" />
  <rect x="59" y="83" width="2" height="2" fill="#cbd5e1" />
  <rect x="64" y="76" width="7" height="4" fill="#b45309" stroke="#cbd5e1" stroke-width="0.6" /> <!-- C1 -->
  <rect x="64" y="84" width="7" height="4" fill="#b45309" stroke="#cbd5e1" stroke-width="0.6" /> <!-- C2 -->
  <rect x="64" y="92" width="7" height="4" fill="#1e293b" stroke="#cbd5e1" stroke-width="0.6" /> <!-- R1 -->

  <!-- 6. ESP-12F WiFi Module Body (Silver Metal Shield + Black Antenna PCB) -->
  <!-- Module Base Outline -->
  <rect x="82" y="28" width="122" height="117" rx="4" fill="#020617" stroke="#075985" stroke-width="1" />

  <!-- ESP-12F Metal Shield -->
  <rect x="84" y="30" width="86" height="113" rx="3" fill="url(#metalShield)" stroke="#475569" stroke-width="1.2" />
  <!-- Shield Internal Bevel & Ventilation indent -->
  <rect x="87" y="33" width="80" height="107" rx="2" fill="none" stroke="#f8fafc" stroke-width="0.5" opacity="0.5" />

  <!-- Shield Markings & Logo -->
  <circle cx="124" cy="56" r="9" fill="none" stroke="#334155" stroke-width="1.2" />
  <!-- WiFi Arcs -->
  <path d="M 118 58 A 7 7 0 0 1 130 58" fill="none" stroke="#334155" stroke-width="1.5" stroke-linecap="round" />
  <path d="M 120 61 A 4 4 0 0 1 128 61" fill="none" stroke="#334155" stroke-width="1.5" stroke-linecap="round" />
  <circle cx="124" cy="63.5" r="1" fill="#334155" />
  <text x="124" y="77" font-family="sans-serif" font-size="8" font-weight="bold" fill="#1e293b" text-anchor="middle">ESP8266</text>
  <text x="124" y="88" font-family="sans-serif" font-size="6.5" font-weight="bold" fill="#334155" text-anchor="middle">MOD ESP-12F</text>
  <text x="124" y="98" font-family="monospace" font-size="4.5" fill="#475569" text-anchor="middle">FCC ID:2AHMR-ESP12F</text>
  <text x="124" y="106" font-family="monospace" font-size="4.5" fill="#475569" text-anchor="middle">ISM 2.4GHz / PA +25dBm</text>
  <text x="124" y="128" font-family="monospace" font-size="5" font-weight="bold" fill="#0284c7" text-anchor="middle">WeMos D1 mini</text>

  <!-- ESP8266 Castellation Solder Pads (Top & Bottom of module) -->
  <!-- Top module pads -->
  <rect x="92" y="27" width="5" height="3" fill="#eab308" />
  <rect x="104" y="27" width="5" height="3" fill="#eab308" />
  <rect x="116" y="27" width="5" height="3" fill="#eab308" />
  <rect x="128" y="27" width="5" height="3" fill="#eab308" />
  <rect x="140" y="27" width="5" height="3" fill="#eab308" />
  <rect x="152" y="27" width="5" height="3" fill="#eab308" />
  <!-- Bottom module pads -->
  <rect x="92" y="143" width="5" height="3" fill="#eab308" />
  <rect x="104" y="143" width="5" height="3" fill="#eab308" />
  <rect x="116" y="143" width="5" height="3" fill="#eab308" />
  <rect x="128" y="143" width="5" height="3" fill="#eab308" />
  <rect x="140" y="143" width="5" height="3" fill="#eab308" />
  <rect x="152" y="143" width="5" height="3" fill="#eab308" />

  <!-- ESP-12F PCB Meander Antenna (Right side, dark PCB with gold tracks) -->
  <rect x="172" y="30" width="30" height="113" rx="2" fill="#0f172a" stroke="#1e293b" stroke-width="0.8" />
  <!-- Gold Meander Trace -->
  <path d="M 175 42 L 198 42 L 198 52 L 175 52 L 175 62 L 198 62 L 198 72 L 175 72 L 175 82 L 198 82 L 198 92 L 175 92 L 175 102 L 198 102 L 198 112 L 175 112 L 175 124 L 198 124 L 198 132" 
        fill="none" stroke="#eab308" stroke-width="2.4" stroke-linecap="square" stroke-linejoin="miter" />

  <!-- 7. Pin Headers & Gold Socket Pads (Top & Bottom Rows) -->
  <!-- Top Header Strip (Dark Plastic Base) -->
  <rect x="44" y="2" width="140" height="16" rx="2" fill="#1e293b" stroke="#0f172a" stroke-width="1" />
  <!-- Bottom Header Strip (Dark Plastic Base) -->
  <rect x="44" y="155" width="140" height="16" rx="2" fill="#1e293b" stroke="#0f172a" stroke-width="1" />

  <!-- 8 Top Sockets & Labels (X: 54.5, 71.5, 88.5, 105.5, 122.5, 139.5, 156.5, 173.5 ; Y: 10.0) -->
  <!-- Top 1: RST -->
  <circle cx="54.5" cy="10.0" r="5" fill="url(#goldPad)" stroke="#78350f" stroke-width="0.8" />
  <circle cx="54.5" cy="10.0" r="2.5" fill="#020617" />
  <text x="54.5" y="25" font-family="monospace" font-size="6" font-weight="bold" fill="#ffffff" text-anchor="middle">RST</text>

  <!-- Top 2: A0 -->
  <circle cx="71.5" cy="10.0" r="5" fill="url(#goldPad)" stroke="#78350f" stroke-width="0.8" />
  <circle cx="71.5" cy="10.0" r="2.5" fill="#020617" />
  <text x="71.5" y="25" font-family="monospace" font-size="6" font-weight="bold" fill="#ffffff" text-anchor="middle">A0</text>

  <!-- Top 3: D0 -->
  <circle cx="88.5" cy="10.0" r="5" fill="url(#goldPad)" stroke="#78350f" stroke-width="0.8" />
  <circle cx="88.5" cy="10.0" r="2.5" fill="#020617" />
  <text x="88.5" y="25" font-family="monospace" font-size="6" font-weight="bold" fill="#ffffff" text-anchor="middle">D0</text>

  <!-- Top 4: D5 -->
  <circle cx="105.5" cy="10.0" r="5" fill="url(#goldPad)" stroke="#78350f" stroke-width="0.8" />
  <circle cx="105.5" cy="10.0" r="2.5" fill="#020617" />
  <text x="105.5" y="25" font-family="monospace" font-size="6" font-weight="bold" fill="#ffffff" text-anchor="middle">D5</text>

  <!-- Top 5: D6 -->
  <circle cx="122.5" cy="10.0" r="5" fill="url(#goldPad)" stroke="#78350f" stroke-width="0.8" />
  <circle cx="122.5" cy="10.0" r="2.5" fill="#020617" />
  <text x="122.5" y="25" font-family="monospace" font-size="6" font-weight="bold" fill="#ffffff" text-anchor="middle">D6</text>

  <!-- Top 6: D7 -->
  <circle cx="139.5" cy="10.0" r="5" fill="url(#goldPad)" stroke="#78350f" stroke-width="0.8" />
  <circle cx="139.5" cy="10.0" r="2.5" fill="#020617" />
  <text x="139.5" y="25" font-family="monospace" font-size="6" font-weight="bold" fill="#ffffff" text-anchor="middle">D7</text>

  <!-- Top 7: D8 -->
  <circle cx="156.5" cy="10.0" r="5" fill="url(#goldPad)" stroke="#78350f" stroke-width="0.8" />
  <circle cx="156.5" cy="10.0" r="2.5" fill="#020617" />
  <text x="156.5" y="25" font-family="monospace" font-size="6" font-weight="bold" fill="#ffffff" text-anchor="middle">D8</text>

  <!-- Top 8: 3V3 -->
  <circle cx="173.5" cy="10.0" r="5" fill="url(#goldPad)" stroke="#78350f" stroke-width="0.8" />
  <circle cx="173.5" cy="10.0" r="2.5" fill="#020617" />
  <text x="173.5" y="25" font-family="monospace" font-size="6" font-weight="bold" fill="#ffffff" text-anchor="middle">3V3</text>


  <!-- 8 Bottom Sockets & Labels (X: 54.5, 71.5, 88.5, 105.5, 122.5, 139.5, 156.5, 173.5 ; Y: 163.0) -->
  <!-- Bot 1: TX -->
  <text x="54.5" y="152" font-family="monospace" font-size="6" font-weight="bold" fill="#ffffff" text-anchor="middle">TX</text>
  <circle cx="54.5" cy="163.0" r="5" fill="url(#goldPad)" stroke="#78350f" stroke-width="0.8" />
  <circle cx="54.5" cy="163.0" r="2.5" fill="#020617" />

  <!-- Bot 2: RX -->
  <text x="71.5" y="152" font-family="monospace" font-size="6" font-weight="bold" fill="#ffffff" text-anchor="middle">RX</text>
  <circle cx="71.5" cy="163.0" r="5" fill="url(#goldPad)" stroke="#78350f" stroke-width="0.8" />
  <circle cx="71.5" cy="163.0" r="2.5" fill="#020617" />

  <!-- Bot 3: D1 -->
  <text x="88.5" y="152" font-family="monospace" font-size="6" font-weight="bold" fill="#ffffff" text-anchor="middle">D1</text>
  <circle cx="88.5" cy="163.0" r="5" fill="url(#goldPad)" stroke="#78350f" stroke-width="0.8" />
  <circle cx="88.5" cy="163.0" r="2.5" fill="#020617" />

  <!-- Bot 4: D2 -->
  <text x="105.5" y="152" font-family="monospace" font-size="6" font-weight="bold" fill="#ffffff" text-anchor="middle">D2</text>
  <circle cx="105.5" cy="163.0" r="5" fill="url(#goldPad)" stroke="#78350f" stroke-width="0.8" />
  <circle cx="105.5" cy="163.0" r="2.5" fill="#020617" />

  <!-- Bot 5: D3 -->
  <text x="122.5" y="152" font-family="monospace" font-size="6" font-weight="bold" fill="#ffffff" text-anchor="middle">D3</text>
  <circle cx="122.5" cy="163.0" r="5" fill="url(#goldPad)" stroke="#78350f" stroke-width="0.8" />
  <circle cx="122.5" cy="163.0" r="2.5" fill="#020617" />

  <!-- Bot 6: D4 -->
  <text x="139.5" y="152" font-family="monospace" font-size="6" font-weight="bold" fill="#ffffff" text-anchor="middle">D4</text>
  <circle cx="139.5" cy="163.0" r="5" fill="url(#goldPad)" stroke="#78350f" stroke-width="0.8" />
  <circle cx="139.5" cy="163.0" r="2.5" fill="#020617" />

  <!-- Bot 7: GND -->
  <text x="156.5" y="152" font-family="monospace" font-size="6" font-weight="bold" fill="#ffffff" text-anchor="middle">GND</text>
  <circle cx="156.5" cy="163.0" r="5" fill="url(#goldPad)" stroke="#78350f" stroke-width="0.8" />
  <circle cx="156.5" cy="163.0" r="2.5" fill="#020617" />

  <!-- Bot 8: 5V -->
  <text x="173.5" y="152" font-family="monospace" font-size="6" font-weight="bold" fill="#ffffff" text-anchor="middle">5V</text>
  <circle cx="173.5" cy="163.0" r="5" fill="url(#goldPad)" stroke="#78350f" stroke-width="0.8" />
  <circle cx="173.5" cy="163.0" r="2.5" fill="#020617" />
</svg>