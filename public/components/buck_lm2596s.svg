<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 767 375" width="767" height="375">
  <!-- 1. PCB BASE BOARD (Dark Industrial Blue) -->
  <rect x="0" y="0" width="767" height="375" fill="#254e89"/>

  <!-- 2. FOUR CORNER PADS (Solder Terminals) -->
  <!-- Top-Left (IN+) -->
  <rect x="0" y="0" width="57" height="57" fill="#e6e6e6"/>
  <circle cx="29" cy="29" r="11.5" fill="#808080"/>

  <!-- Bottom-Left (IN-) -->
  <rect x="0" y="318" width="57" height="57" fill="#e6e6e6"/>
  <circle cx="29" cy="345" r="11.5" fill="#808080"/>

  <!-- Top-Right (OUT+) -->
  <rect x="710" y="0" width="57" height="57" fill="#e6e6e6"/>
  <circle cx="737" cy="29" r="11.5" fill="#808080"/>

  <!-- Bottom-Right (OUT-) -->
  <rect x="710" y="318" width="57" height="57" fill="#e6e6e6"/>
  <circle cx="737" cy="345" r="11.5" fill="#808080"/>

  <!-- 3. TWO WHITE MOUNTING HOLES -->
  <circle cx="80" cy="29" r="22" fill="#eeeeee"/>
  <circle cx="686" cy="345" r="22" fill="#eeeeee"/>

  <!-- 4. SILKSCREEN TEXT LABELS (Courier New Bold) -->
  <g font-family="'Courier New', Courier, monospace" font-size="29" font-weight="bold" fill="#ffffff">
    <text x="10" y="99">IN+</text>
    <text x="10" y="297">IN-</text>
    <text x="678" y="99">OUT+</text>
    <text x="680" y="297">OUT-</text>
  </g>

  <!-- 5. LOGO (LEARN AS YOU GO) -->
  <image href="data:image/png;base64," x="555" y="23" width="123" height="31" preserveAspectRatio="none"/>

  <!-- 6. INPUT CAPACITOR (LEFT: Center 90, 187) -->
  <!-- Outer Black Ring (r=68) -->
  <circle cx="90" cy="187" r="68" fill="#1a1a1a"/>
  <!-- Negative Polarity Grey Wedge (Bottom) -->
  <path d="M 42 241 L 58 213 L 122 213 L 138 241 A 68 68 0 0 1 42 241 Z" fill="#b3b3b3"/>
  <!-- Inner White/Silver Circle (r=46.5) -->
  <circle cx="90" cy="187" r="46.5" fill="#e6e6e6"/>
  <!-- Inner Negative Polarity Segment -->
  <path d="M 58 213 L 122 213 A 46.5 46.5 0 0 1 58 213 Z" fill="#b3b3b3"/>

  <!-- 7. OUTPUT CAPACITOR (RIGHT: Center 675, 187) -->
  <!-- Outer Black Ring (r=68) -->
  <circle cx="675" cy="187" r="68" fill="#1a1a1a"/>
  <!-- Negative Polarity Grey Wedge (Bottom) -->
  <path d="M 627 241 L 643 213 L 707 213 L 723 241 A 68 68 0 0 1 627 241 Z" fill="#b3b3b3"/>
  <!-- Inner White/Silver Circle (r=46.5) -->
  <circle cx="675" cy="187" r="46.5" fill="#e6e6e6"/>
  <!-- Inner Negative Polarity Segment -->
  <path d="M 643 213 L 707 213 A 46.5 46.5 0 0 1 643 213 Z" fill="#b3b3b3"/>

  <!-- 8. IC LM2596S (TO-263 / D2PAK) -->
  <!-- Top Heatsink Solder Tab with Chamfer -->
  <polygon points="205,20 347,20 361,34 361,50 191,50 191,34" fill="#e6e6e6"/>
  <!-- Main Black IC Body with Chamfer Top Corners -->
  <polygon points="195,50 357,50 361,54 361,195 191,195 191,54" fill="#18181b"/>
  
  <!-- 5 IC Leads -->
  <!-- Lead 1 (center 200.5) -->
  <rect x="191.5" y="195" width="18" height="18" fill="#b3b3b3"/>
  <rect x="191.5" y="213" width="18" height="48" fill="#e6e6e6"/>
  <polygon points="191.5,261 209.5,261 204.5,275 196.5,275" fill="#e6e6e6"/>
  <!-- Lead 2 (center 234.5) -->
  <rect x="225.5" y="195" width="18" height="18" fill="#b3b3b3"/>
  <rect x="225.5" y="213" width="18" height="48" fill="#e6e6e6"/>
  <polygon points="225.5,261 243.5,261 238.5,275 230.5,275" fill="#e6e6e6"/>
  <!-- Lead 3 (center 268.5) -->
  <rect x="259.5" y="195" width="18" height="18" fill="#b3b3b3"/>
  <rect x="259.5" y="213" width="18" height="48" fill="#e6e6e6"/>
  <polygon points="259.5,261 277.5,261 272.5,275 264.5,275" fill="#e6e6e6"/>
  <!-- Lead 4 (center 302.5) -->
  <rect x="293.5" y="195" width="18" height="18" fill="#b3b3b3"/>
  <rect x="293.5" y="213" width="18" height="48" fill="#e6e6e6"/>
  <polygon points="293.5,261 311.5,261 306.5,275 298.5,275" fill="#e6e6e6"/>
  <!-- Lead 5 (center 336.5) -->
  <rect x="327.5" y="195" width="18" height="18" fill="#b3b3b3"/>
  <rect x="327.5" y="213" width="18" height="48" fill="#e6e6e6"/>
  <polygon points="327.5,261 345.5,261 340.5,275 332.5,275" fill="#e6e6e6"/>

  <!-- 9. SCHOTTKY DIODE (SS34 / SS54) -->
  <rect x="227" y="310" width="16" height="42" fill="#e6e6e6"/>
  <rect x="243" y="310" width="83" height="42" fill="#18181b"/>
  <rect x="326" y="310" width="16" height="42" fill="#e6e6e6"/>

  <!-- 10. TRIMPOT 3296W -->
  <rect x="397" y="29" width="170" height="76" fill="#3c85ca"/>
  <circle cx="422" cy="57" r="18" fill="#d6a600"/>
  <rect x="420" y="41" width="4" height="32" fill="#8f6d00"/>

  <!-- 11. SHIELDED INDUCTOR -->
  <rect x="376" y="143" width="203" height="203" rx="18" fill="#333333" stroke="#18181b" stroke-width="4"/>
  <!-- 4 Corner Indentations -->
  <circle cx="406" cy="173" r="16" fill="#18181b"/>
  <circle cx="549" cy="173" r="16" fill="#18181b"/>
  <circle cx="406" cy="316" r="16" fill="#18181b"/>
  <circle cx="549" cy="316" r="16" fill="#18181b"/>
  <!-- Center Ferrite Core -->
  <circle cx="477.5" cy="244.5" r="86" fill="#292929" stroke="#18181b" stroke-width="5"/>
</svg>