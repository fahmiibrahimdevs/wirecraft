<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 165.6" width="300" height="165.6">
  <defs>
    <!-- Filter bayangan halus -->
    <filter id="hcsr-drop-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <filter id="hcsr-pin-shadow" x="-20%" y="-10%" width="140%" height="140%">
      <feDropShadow dx="1" dy="2" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <!-- Transducer metal gradients -->
    <radialGradient id="hcsr-can-outer" cx="45%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="35%" stop-color="#cbd5e1"/>
      <stop offset="70%" stop-color="#94a3b8"/>
      <stop offset="95%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#334155"/>
    </radialGradient>
    <radialGradient id="hcsr-can-rim" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#94a3b8"/>
      <stop offset="90%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </radialGradient>
    <radialGradient id="hcsr-mesh-bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="75%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>

    <!-- Crystal oscillator gradient -->
    <linearGradient id="hcsr-crystal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f1f5f9"/>
      <stop offset="20%" stop-color="#e2e8f0"/>
      <stop offset="50%" stop-color="#94a3b8"/>
      <stop offset="80%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>

    <!-- PCB Surface gradient -->
    <linearGradient id="hcsr-pcb-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e4f8a"/>
      <stop offset="50%" stop-color="#183f70"/>
      <stop offset="100%" stop-color="#123057"/>
    </linearGradient>

    <!-- Pin Metal Gradient -->
    <linearGradient id="hcsr-pin-metal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="25%" stop-color="#cbd5e1"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="75%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>

    <!-- Mesh Pattern for Transducer -->
    <pattern id="hcsr-mesh-pat" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="4" fill="none"/>
      <circle cx="2" cy="2" r="1.1" fill="#475569" opacity="0.6"/>
      <circle cx="0" cy="0" r="0.7" fill="#64748b" opacity="0.4"/>
      <circle cx="4" cy="0" r="0.7" fill="#64748b" opacity="0.4"/>
      <circle cx="0" cy="4" r="0.7" fill="#64748b" opacity="0.4"/>
      <circle cx="4" cy="4" r="0.7" fill="#64748b" opacity="0.4"/>
    </pattern>
  </defs>

  <!-- ================= PCB SUBSTRATE ================= -->
  <rect x="2" y="2" width="296" height="142" rx="7" fill="none" stroke="#0f172a" stroke-width="2"/>
  <rect x="3" y="3" width="294" height="140" rx="6" fill="url(#hcsr-pcb-grad)" filter="url(#hcsr-drop-shadow)"/>
  
  <!-- PCB Border Silkscreen line -->
  <rect x="6" y="6" width="288" height="134" rx="4" fill="none" stroke="#ffffff" stroke-width="0.75" opacity="0.25"/>

  <!-- Traces tembaga subtil -->
  <path d="M 126.1 110 L 126.1 85 L 140 70" fill="none" stroke="#1d4ed8" stroke-width="1.8" opacity="0.5"/>
  <path d="M 143.1 110 L 143.1 78 L 148 73" fill="none" stroke="#1d4ed8" stroke-width="1.8" opacity="0.5"/>
  <path d="M 160.1 110 L 160.1 78 L 152 73" fill="none" stroke="#1d4ed8" stroke-width="1.8" opacity="0.5"/>
  <path d="M 177.1 110 L 177.1 85 L 160 70" fill="none" stroke="#1d4ed8" stroke-width="1.8" opacity="0.5"/>
  <path d="M 68 70 L 68 115 L 85 130" fill="none" stroke="#1d4ed8" stroke-width="2" opacity="0.4"/>
  <path d="M 232 70 L 232 115 L 215 130" fill="none" stroke="#1d4ed8" stroke-width="2" opacity="0.4"/>

  <!-- 4 Corner Mounting Holes (Plated Pads) -->
  <g>
    <!-- Top-Left -->
    <circle cx="15" cy="15" r="9" fill="#94a3b8" stroke="#cbd5e1" stroke-width="0.8"/>
    <circle cx="15" cy="15" r="6.5" fill="#0f172a" stroke="#475569" stroke-width="1"/>
    <!-- Bottom-Left -->
    <circle cx="15" cy="131" r="9" fill="#94a3b8" stroke="#cbd5e1" stroke-width="0.8"/>
    <circle cx="15" cy="131" r="6.5" fill="#0f172a" stroke="#475569" stroke-width="1"/>
    <!-- Top-Right -->
    <circle cx="285" cy="15" r="9" fill="#94a3b8" stroke="#cbd5e1" stroke-width="0.8"/>
    <circle cx="285" cy="15" r="6.5" fill="#0f172a" stroke="#475569" stroke-width="1"/>
    <!-- Bottom-Right -->
    <circle cx="285" cy="131" r="9" fill="#94a3b8" stroke="#cbd5e1" stroke-width="0.8"/>
    <circle cx="285" cy="131" r="6.5" fill="#0f172a" stroke="#475569" stroke-width="1"/>
  </g>

  <!-- ================= TRANSDUCER KIRI (T) ================= -->
  <g filter="url(#hcsr-drop-shadow)">
    <!-- Outer Metal Can Base -->
    <circle cx="68" cy="70" r="46" fill="url(#hcsr-can-outer)"/>
    <circle cx="68" cy="70" r="44.5" fill="none" stroke="#64748b" stroke-width="1"/>
    <!-- Outer Beveled Rim -->
    <circle cx="68" cy="70" r="41" fill="url(#hcsr-can-rim)"/>
    <circle cx="68" cy="70" r="36" fill="#0f172a"/>
    <!-- Inner Mesh Screen -->
    <circle cx="68" cy="70" r="34.5" fill="url(#hcsr-mesh-bg)"/>
    <circle cx="68" cy="70" r="34.5" fill="url(#hcsr-mesh-pat)"/>
    <!-- Subtle Center Piezo Cone Highlight -->
    <circle cx="68" cy="70" r="16" fill="none" stroke="#64748b" stroke-width="1" opacity="0.6"/>
    <circle cx="68" cy="70" r="6" fill="#1e293b" stroke="#475569" stroke-width="0.8"/>
    <!-- Rim Highlight Reflection -->
    <path d="M 34 50 A 42 42 0 0 1 85 30" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
  </g>

  <!-- ================= TRANSDUCER KANAN (R) ================= -->
  <g filter="url(#hcsr-drop-shadow)">
    <!-- Outer Metal Can Base -->
    <circle cx="232" cy="70" r="46" fill="url(#hcsr-can-outer)"/>
    <circle cx="232" cy="70" r="44.5" fill="none" stroke="#64748b" stroke-width="1"/>
    <!-- Outer Beveled Rim -->
    <circle cx="232" cy="70" r="41" fill="url(#hcsr-can-rim)"/>
    <circle cx="232" cy="70" r="36" fill="#0f172a"/>
    <!-- Inner Mesh Screen -->
    <circle cx="232" cy="70" r="34.5" fill="url(#hcsr-mesh-bg)"/>
    <circle cx="232" cy="70" r="34.5" fill="url(#hcsr-mesh-pat)"/>
    <!-- Subtle Center Piezo Cone Highlight -->
    <circle cx="232" cy="70" r="16" fill="none" stroke="#64748b" stroke-width="1" opacity="0.6"/>
    <circle cx="232" cy="70" r="6" fill="#1e293b" stroke="#475569" stroke-width="0.8"/>
    <!-- Rim Highlight Reflection -->
    <path d="M 198 50 A 42 42 0 0 1 249 30" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
  </g>

  <!-- ================= KRISTAL OSILATOR (HC-49S) ================= -->
  <g filter="url(#hcsr-drop-shadow)">
    <!-- Base plate -->
    <rect x="122" y="16" width="56" height="24" rx="12" fill="#1e293b"/>
    <!-- Metal can body -->
    <rect x="123" y="17" width="54" height="22" rx="11" fill="url(#hcsr-crystal)"/>
    <rect x="123" y="17" width="54" height="22" rx="11" fill="none" stroke="#cbd5e1" stroke-width="0.8"/>
    <!-- Crystal Spec Text -->
    <text x="150" y="31" font-family="'JetBrains Mono', monospace, Arial" font-size="7.5" font-weight="bold" fill="#0f172a" text-anchor="middle" letter-spacing="0.5">4.000 MHz</text>
  </g>

  <!-- ================= SILKSCREEN LABELS ================= -->
  <!-- Main Title -->
  <text x="150" y="66" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="16" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1.2" opacity="0.95">HC-SR04</text>

  <!-- Pin Silkscreen Labels (Vertikal rapi -90deg di atas pin header sesuai modul HC-SR04 asli) -->
  <g font-family="'JetBrains Mono', monospace, Arial" font-size="7.5" font-weight="bold" fill="#ffffff" opacity="0.95">
    <text x="126.1" y="125" transform="rotate(-90, 126.1, 125)" text-anchor="start">VCC</text>
    <text x="143.1" y="125" transform="rotate(-90, 143.1, 125)" text-anchor="start">TRIG</text>
    <text x="160.1" y="125" transform="rotate(-90, 160.1, 125)" text-anchor="start">ECHO</text>
    <text x="177.1" y="125" transform="rotate(-90, 177.1, 125)" text-anchor="start">GND</text>
  </g>

  <!-- Silkscreen Box outline mengelilingi area header -->
  <rect x="115.5" y="129.5" width="72" height="15.5" rx="2" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.85"/>

  <!-- ================= BREAKAWAY PIN HEADER STRIP 4-PIN ================= -->
  <!-- Pitch 17.0px: Pin 1=126.1, Pin 2=143.1, Pin 3=160.1, Pin 4=177.1 -->
  <!-- y Header: 130 .. 144 (H=14px), Pin menjulur sampai y=163.5 -->
  <g id="pin-header-strip" filter="url(#hcsr-drop-shadow)">
    <!-- 1. Badan Inti Plastik Hitam Yang Menghubungkan 4 Segmen -->
    <rect x="117.1" y="130" width="69.0" height="14" rx="2" fill="#000000"/>

    <!-- 2. Segmen Kubus Individual per Pin (16px x 14px, rx=3) -->
    <!-- Segmen 1 (VCC, center 126.1) -->
    <rect x="118.1" y="130" width="16" height="14" rx="3" fill="#09090b" stroke="#27272a" stroke-width="0.7"/>
    <!-- Segmen 2 (TRIG, center 143.1) -->
    <rect x="135.1" y="130" width="16" height="14" rx="3" fill="#09090b" stroke="#27272a" stroke-width="0.7"/>
    <!-- Segmen 3 (ECHO, center 160.1) -->
    <rect x="152.1" y="130" width="16" height="14" rx="3" fill="#09090b" stroke="#27272a" stroke-width="0.7"/>
    <!-- Segmen 4 (GND, center 177.1) -->
    <rect x="169.1" y="130" width="16" height="14" rx="3" fill="#09090b" stroke="#27272a" stroke-width="0.7"/>

    <!-- 3. Alur Breakaway Notch (V-Groove) Pemisah Antar Pin -->
    <line x1="134.6" y1="129.5" x2="134.6" y2="144.5" stroke="#000000" stroke-width="1.4"/>
    <line x1="134.6" y1="130.5" x2="134.6" y2="143.5" stroke="#18181b" stroke-width="0.6"/>

    <line x1="151.6" y1="129.5" x2="151.6" y2="144.5" stroke="#000000" stroke-width="1.4"/>
    <line x1="151.6" y1="130.5" x2="151.6" y2="143.5" stroke="#18181b" stroke-width="0.6"/>

    <line x1="168.6" y1="129.5" x2="168.6" y2="144.5" stroke="#000000" stroke-width="1.4"/>
    <line x1="168.6" y1="130.5" x2="168.6" y2="143.5" stroke="#18181b" stroke-width="0.6"/>

    <!-- 4. Highlight Chamfer 3D di Permukaan Atas Plastik -->
    <path d="M 119.5 131 L 132.5 131 L 131.5 132.5 L 120.5 132.5 Z" fill="#52525b" opacity="0.8"/>
    <path d="M 136.5 131 L 149.5 131 L 148.5 132.5 L 137.5 132.5 Z" fill="#52525b" opacity="0.8"/>
    <path d="M 153.5 131 L 166.5 131 L 165.5 132.5 L 154.5 132.5 Z" fill="#52525b" opacity="0.8"/>
    <path d="M 170.5 131 L 183.5 131 L 182.5 132.5 L 171.5 132.5 Z" fill="#52525b" opacity="0.8"/>

    <!-- Lubang Tengah Pin Header (Socket Opening) -->
    <rect x="124.1" y="135" width="4" height="4" rx="0.8" fill="#000000"/>
    <rect x="141.1" y="135" width="4" height="4" rx="0.8" fill="#000000"/>
    <rect x="158.1" y="135" width="4" height="4" rx="0.8" fill="#000000"/>
    <rect x="175.1" y="135" width="4" height="4" rx="0.8" fill="#000000"/>
  </g>

  <!-- ================= 4 KAKI PIN SILINDER 3D PROPORSIONAL ================= -->
  <!-- Dari center kubus y=137 turun sampai y=163.5 (melewati tepi PCB y=142) -->
  <g id="male-pin-legs" filter="url(#hcsr-pin-shadow)">
    <!-- Pin 1: VCC (x=126.1) -->
    <rect x="124.5" y="138" width="3.2" height="23" rx="0.6" fill="url(#hcsr-pin-metal)"/>
    <path d="M 124.5 161 L 126.1 163.5 L 127.7 161 Z" fill="#cbd5e1" stroke="#475569" stroke-width="0.3"/>
    
    <!-- Pin 2: TRIG (x=143.1) -->
    <rect x="141.5" y="138" width="3.2" height="23" rx="0.6" fill="url(#hcsr-pin-metal)"/>
    <path d="M 141.5 161 L 143.1 163.5 L 144.7 161 Z" fill="#cbd5e1" stroke="#475569" stroke-width="0.3"/>

    <!-- Pin 3: ECHO (x=160.1) -->
    <rect x="158.5" y="138" width="3.2" height="23" rx="0.6" fill="url(#hcsr-pin-metal)"/>
    <path d="M 158.5 161 L 160.1 163.5 L 161.7 161 Z" fill="#cbd5e1" stroke="#475569" stroke-width="0.3"/>

    <!-- Pin 4: GND (x=177.1) -->
    <rect x="175.5" y="138" width="3.2" height="23" rx="0.6" fill="url(#hcsr-pin-metal)"/>
    <path d="M 175.5 161 L 177.1 163.5 L 178.7 161 Z" fill="#cbd5e1" stroke="#475569" stroke-width="0.3"/>
  </g>
</svg>
